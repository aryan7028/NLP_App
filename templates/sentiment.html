<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sentiment Analysis</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: wheat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fffaf2;
            padding: 30px 35px;
            width: 420px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #5a3e1b;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #5a3e1b;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #c8b08a;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #8b6b3e;
            box-shadow: 0 0 5px rgba(139, 107, 62, 0.4);
        }

        input[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #8b6b3e;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #73542d;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Sentiment Analysis</h1>

        <form action="/perform_sentiment_analysis" method="post">

            <label>Type your text here:</label>
            <textarea name="sentiment_text"></textarea>

            <input type="submit" value="Perform Sentiment Analysis">

        </form>
    </div>

</body>
</html>
